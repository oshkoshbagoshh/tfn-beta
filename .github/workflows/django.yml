# Django CI: test on push/PR to main
# Uses uv for install; Python 3.13 from .python-version
name: Django CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run migrations (music_beta first for custom User)
        run: |
          uv run python manage.py migrate music_beta --noinput
          uv run python manage.py migrate --noinput

      - name: Run Django system checks
        run: uv run python manage.py check

      - name: Run tests
        run: uv run python manage.py test --noinput -v 1
