# Lint / code quality: Django check and optional static checks
# Runs on push and PR to main; fast feedback without full test suite
name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Django check
        run: uv run python manage.py check

